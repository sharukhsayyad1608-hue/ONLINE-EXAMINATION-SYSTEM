<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colleges | ExamPortal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f8f8;
    color:#173033;
    min-height:100vh;
}

/* LIGHT GRID */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(20,123,125,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(20,123,125,.035) 1px,transparent 1px);
    background-size:40px 40px;
    z-index:-1;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    background:#ffffff;
    border-right:1px solid #e1e9e8;
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    box-shadow:4px 0 18px rgba(23,48,51,.04);
}

.logo-area{
    text-align:center;
    margin-bottom:35px;
}

.logo-area img{
    width:42px;
    height:42px;
    object-fit:contain;
    vertical-align:middle;
}

.logo-text{
    font-size:20px;
    font-weight:bold;
    margin-left:7px;
    vertical-align:middle;
    color:#173033;
}

.logo-text span{
    color:#147b7d;
}

.admin-label{
    margin-top:10px;
    color:#147b7d;
    font-size:11px;
    letter-spacing:2px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.nav a{
    text-decoration:none;
    color:#64777a;
    padding:14px 15px;
    border-radius:12px;
    font-size:14px;
    transition:.2s;
}

.nav a:hover{
    background:#edf7f7;
    color:#147b7d;
}

.nav a.active{
    background:#147b7d;
    color:white;
    box-shadow:0 8px 25px rgba(20,123,125,.18);
}

.logout{
    margin-top:auto;
}

.logout a{
    display:block;
    text-align:center;
    padding:13px;
    border:1px solid #dbe6e5;
    border-radius:12px;
    color:#e05b67;
    text-decoration:none;
}

.logout a:hover{
    background:#fff5f5;
}

/* MAIN */
.main{
    margin-left:250px;
    padding:35px 40px 60px;
}

/* HEADER */
.header{
    margin-bottom:30px;
}

.header h1{
    font-size:34px;
    color:#173033;
    margin-bottom:7px;
}

.header h1 span{
    color:#147b7d;
}

.header p{
    color:#718386;
    font-size:13px;
}

/* STAT CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:#ffffff;
    border:1px solid #dbe6e5;
    border-radius:18px;
    padding:25px;
    box-shadow:0 8px 25px rgba(23,48,51,.045);
}

.card h4{
    color:#718386;
    font-size:13px;
    margin-bottom:10px;
}

.card h2{
    font-size:30px;
    color:#147b7d;
}

/* TABLE */
.table-box{
    background:#ffffff;
    padding:25px;
    border-radius:18px;
    border:1px solid #dbe6e5;
    box-shadow:0 8px 25px rgba(23,48,51,.045);
}

.table-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.table-top h2{
    font-size:20px;
    color:#203536;
}

.search{
    padding:12px 15px;
    border:1px solid #d8e3e2;
    border-radius:9px;
    width:270px;
    outline:none;
    color:#173033;
    background:#fff;
}

.search:focus{
    border-color:#147b7d;
    box-shadow:0 0 0 3px rgba(20,123,125,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    padding:15px;
    text-align:left;
    border-bottom:1px solid #e8eeee;
}

th{
    background:#f6f9f9;
    color:#607477;
    font-size:13px;
}

td{
    font-size:14px;
    color:#31494b;
}

td strong{
    color:#173033;
}

.badge{
    display:inline-block;
    padding:6px 11px;
    border-radius:20px;
    background:#e6f5f5;
    color:#147b7d;
    font-size:12px;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:45px;
    color:#7a8a8c;
}

/* RESPONSIVE */
@media(max-width:1000px){

    .cards{
        grid-template-columns:1fr;
    }

}

@media(max-width:700px){

    .sidebar{
        width:70px;
        padding:20px 10px;
    }

    .logo-text,
    .admin-label,
    .nav a span,
    .logout a span{
        display:none;
    }

    .logo-area img{
        width:35px;
        height:35px;
    }

    .nav a{
        text-align:center;
        font-size:19px;
        padding:13px 5px;
    }

    .main{
        margin-left:70px;
        padding:25px 16px;
    }

    .header h1{
        font-size:26px;
    }

    .table-box{
        overflow-x:auto;
    }

    .table-top{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .search{
        width:100%;
    }
}


/* =========================================================
   EXAMPORTAL COMMON TYPOGRAPHY
   Keeps the same text sizes on all Super Admin pages.
   ========================================================= */

html{
    font-size:16px !important;
}

body{
    font-size:16px !important;
}

/* Sidebar */
.logo-text,
.logo{
    font-size:20px !important;
}

.admin-label{
    font-size:11px !important;
}

.nav a,
.menu a{
    font-size:14px !important;
    line-height:1.4 !important;
}

.logout a,
.menu a.logout{
    font-size:14px !important;
    line-height:1.4 !important;
}

/* Main page heading */
.title h1,
.header h1{
    font-size:34px !important;
    line-height:1.2 !important;
}

.title p,
.header p{
    font-size:13px !important;
    line-height:1.5 !important;
}

/* Top-right admin label */
.admin-profile{
    font-size:14px !important;
    line-height:1.4 !important;
}

/* Section headings */
.table-top h2,
.panel-header h2,
.rating-card h2,
.distribution h2,
.card h2:not([id]),
.reviews-panel .panel-header h2{
    font-size:19px !important;
    line-height:1.3 !important;
}

/* Stat labels */
.card h4,
.stat-title{
    font-size:13px !important;
    line-height:1.3 !important;
}

/* Stat numbers */
.card h2[id],
.stat-number,
.rating-number{
    line-height:1.1 !important;
}

/* Normal table text */
th,
td{
    line-height:1.4 !important;
}

/* Search / input text */
.search,
.search-box input,
.input-group input,
.input-group select{
    font-size:14px !important;
    line-height:1.4 !important;
}

/* Prevent link/button state from changing text size */
a,
button,
input,
select,
textarea{
    text-size-adjust:100%;
    -webkit-text-size-adjust:100%;
}

/* Mobile: keep one consistent mobile heading size */
@media(max-width:700px){
    .title h1,
    .header h1{
        font-size:26px !important;
    }

    .title p,
    .header p{
        font-size:12px !important;
    }

    .nav a,
    .menu a{
        font-size:14px !important;
    }
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">

    <div class="logo-area">

        <img src="logo.png" alt="ExamPortal Logo">

        <span class="logo-text">
            Exam<span>Portal</span>
        </span>

        <div class="admin-label">
            SUPER ADMIN
        </div>

    </div>

    <nav class="nav">

        <a href="admin.html">
            📊 <span>Dashboard</span>
        </a>

        <a href="students.html">
            👨‍🎓 <span>Students</span>
        </a>

        <a href="colleges.html" class="active">
            🏫 <span>Colleges</span>
        </a>

        <a href="reports.html">
            📈 <span>Reports</span>
        </a>

        <a href="admin-settings.html">
            ⚙️ <span>Settings</span>
        </a>

    </nav>

    <div class="logout">

        <a href="login.html">
            🚪 <span>Logout</span>
        </a>

    </div>

</aside>


<!-- MAIN -->
<main class="main">

    <div class="header">

        <h1>
            College <span>Management</span>
        </h1>

        <p>
            View colleges that have logged into ExamPortal.
        </p>

    </div>


    <!-- STAT CARDS -->
    <div class="cards">

        <div class="card">

            <h4>
                Total College Logins
            </h4>

            <h2 id="totalLogins">
                0
            </h2>

        </div>


        <div class="card">

            <h4>
                Unique Colleges
            </h4>

            <h2 id="uniqueColleges">
                0
            </h2>

        </div>


        <div class="card">

            <h4>
                Latest Login
            </h4>

            <h2 id="latestLogin">
                --
            </h2>

        </div>

    </div>


    <!-- COLLEGE TABLE -->
    <div class="table-box">

        <div class="table-top">

            <h2>
                College Login Details
            </h2>

            <input
                type="text"
                id="search"
                class="search"
                placeholder="Search college..."
                onkeyup="displayColleges()"
            >

        </div>


        <table>

            <thead>

                <tr>
                    <th>#</th>
                    <th>College Name</th>
                    <th>College ID</th>
                    <th>Email</th>
                    <th>Type</th>
                    <th>Login Time</th>
                </tr>

            </thead>

            <tbody id="collegeTable">

            </tbody>

        </table>

    </div>

</main>


<script>

/* GET COLLEGE LOGIN RECORDS */
function getColleges(){

    const history =
        JSON.parse(
            localStorage.getItem("loginHistory")
        ) || [];

    return history.filter(user => {

        if(!user.type){
            return false;
        }

        return user.type.toLowerCase() === "college";

    });

}


/* DISPLAY COLLEGES */
function displayColleges(){

    const colleges = getColleges();

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const table =
        document.getElementById("collegeTable");

    table.innerHTML = "";


    const filtered =
        colleges.filter(college => {

            return (

                (college.name || "")
                .toLowerCase()
                .includes(search)

                ||

                (college.userId || "")
                .toLowerCase()
                .includes(search)

                ||

                (college.email || "")
                .toLowerCase()
                .includes(search)

            );

        });


    if(filtered.length === 0){

        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    No college login records found.
                </td>

            </tr>

        `;

        return;

    }


    filtered.forEach((college,index) => {

        let date = "--";


        if(college.timestamp){

            const d =
                new Date(
                    college.timestamp
                );

            date =
                d.toLocaleString();

        }


        table.innerHTML += `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    <strong>
                        ${college.name || "Unknown College"}
                    </strong>
                </td>

                <td>
                    ${college.userId || "--"}
                </td>

                <td>
                    ${college.email || "--"}
                </td>

                <td>

                    <span class="badge">
                        College
                    </span>

                </td>

                <td>
                    ${date}
                </td>

            </tr>

        `;

    });

}


/* UPDATE STATISTICS */
function updateStats(){

    const colleges =
        getColleges();


    /* TOTAL LOGINS */
    document
        .getElementById("totalLogins")
        .textContent =
        colleges.length;


    /* UNIQUE COLLEGES */
    const unique =
        new Set();


    colleges.forEach(college => {

        const id =
            college.userId ||
            college.email ||
            college.name;

        if(id){
            unique.add(id);
        }

    });


    document
        .getElementById("uniqueColleges")
        .textContent =
        unique.size;


    /* LATEST LOGIN */
    if(colleges.length > 0){

        const latest =
            colleges[colleges.length - 1];


        if(latest.timestamp){

            const d =
                new Date(
                    latest.timestamp
                );


            document
                .getElementById("latestLogin")
                .textContent =
                d.toLocaleTimeString([],{

                    hour:"2-digit",
                    minute:"2-digit"

                });

        }

    }
    else{

        document
            .getElementById("latestLogin")
            .textContent =
            "--";

    }

}


/* LOAD PAGE */
function loadPage(){

    updateStats();

    displayColleges();

}


/* AUTO REFRESH */
setInterval(() => {

    updateStats();

    displayColleges();

},3000);


/* START */
loadPage();

</script>

</body>
</html>
