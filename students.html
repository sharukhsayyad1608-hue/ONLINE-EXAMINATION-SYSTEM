<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Students | ExamPortal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

html{
    font-size:16px;
    overflow-y:scroll;
}

body{
    min-height:100vh;
    background:#f5f8f8;
    color:#173033;
}

/* =========================================
   LIGHT BACKGROUND
========================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(20,123,125,.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(20,123,125,.045) 1px,
            transparent 1px
        );

    background-size:40px 40px;
}


/* =========================================
   SIDEBAR
========================================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;

    width:250px;
    height:100vh;

    background:#ffffff;

    padding:25px 18px;

    color:#173033;

    border-right:1px solid #e1e9e8;

    box-shadow:
        4px 0 18px rgba(23,48,51,.035);

    z-index:100;
}


/* Logo */

.logo{
    display:flex;
    align-items:center;

    gap:10px;

    margin-bottom:40px;

    font-size:22px;
    font-weight:700;

    color:#173033;
}

.logo img{
    width:40px;
    height:40px;

    object-fit:contain;

    border-radius:8px;
}

.logo span{
    color:#173033;
}

.logo span::first-letter{
    color:#147b7d;
}


/* =========================================
   MENU
========================================= */

.menu{
    display:flex;
    flex-direction:column;
}

.menu a{
    display:flex;
    align-items:center;
    gap:10px;

    text-decoration:none;

    color:#607474;

    padding:14px 16px;

    margin:7px 0;

    border-radius:10px;

    font-size:15px;
    font-weight:500;

    transition:
        background .25s ease,
        color .25s ease,
        box-shadow .25s ease;
}


/* Sidebar icons */

.menu-icon{
    width:20px;
    min-width:20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    line-height:1;
}

.menu a.active .menu-icon{
    filter:saturate(1.05);
}


/* Hover */

.menu a:hover{
    background:#eef7f7;
    color:#173033;
}


/* Active */

.menu a.active{
    background:#147f81;
    color:#ffffff;

    box-shadow:
        0 8px 25px rgba(20,123,125,.20);
}


/* Logout */

.menu a.logout{
    position:absolute;

    bottom:25px;

    left:18px;
    right:18px;

    color:#e05252;

    margin:0;
}

.menu a.logout:hover{
    background:#fff1f1;
    color:#d43d3d;
}


/* =========================================
   MAIN CONTENT
========================================= */

.main{
    margin-left:250px;

    min-height:100vh;

    padding:35px 32px;
}


/* =========================================
   HEADER
========================================= */

.header{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-bottom:28px;
}

.header h1{
    font-size:30px;
    line-height:1.2;

    font-weight:700;

    color:#173033;
}

.header p{
    color:#718383;

    margin-top:7px;

    font-size:15px;
}


/* =========================================
   STAT CARDS
========================================= */

.cards{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:20px;

    margin-bottom:26px;
}

.card{
    background:#ffffff;

    padding:25px;

    min-height:115px;

    border-radius:16px;

    border:1px solid #dce7e6;

    box-shadow:
        0 8px 25px rgba(25,55,55,.045);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.card:hover{
    transform:translateY(-2px);

    box-shadow:
        0 12px 30px rgba(25,55,55,.08);
}

.card h4{
    color:#718383;

    font-size:14px;

    font-weight:600;
}

.card h2{
    margin-top:10px;

    font-size:30px;

    font-weight:700;

    color:#147b7d;
}


/* =========================================
   TABLE BOX
========================================= */

.table-box{
    background:#ffffff;

    padding:27px;

    border-radius:17px;

    border:1px solid #dce7e6;

    box-shadow:
        0 8px 25px rgba(25,55,55,.045);
}


/* =========================================
   TABLE HEADER
========================================= */

.table-top{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-bottom:22px;
}

.table-top h2{
    font-size:21px;

    font-weight:700;

    color:#173033;
}


/* =========================================
   SEARCH
========================================= */

.search{
    width:280px;

    padding:12px 15px;

    background:#ffffff;

    color:#173033;

    border:1px solid #d8e3e2;

    border-radius:9px;

    outline:none;

    font-size:14px;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

.search::placeholder{
    color:#9aa8a8;
}

.search:focus{
    border-color:#147b7d;

    box-shadow:
        0 0 0 3px rgba(20,123,125,.10);
}


/* =========================================
   TABLE
========================================= */

table{
    width:100%;

    border-collapse:collapse;
}

th,
td{
    padding:15px;

    text-align:left;

    border-bottom:1px solid #e4eceb;
}


/* Table headings */

th{
    background:#f7fafa;

    color:#147b7d;

    font-size:14px;

    font-weight:700;
}


/* Table data */

td{
    font-size:14px;

    color:#607474;

    background:#ffffff;
}

td strong{
    color:#173033;

    font-weight:700;
}


/* Row hover */

tbody tr:hover td{
    background:#f8fbfb;
}


/* =========================================
   STUDENT BADGE
========================================= */

.badge{
    display:inline-block;

    padding:6px 12px;

    border-radius:20px;

    background:#e6f5f3;

    color:#147b7d;

    font-size:12px;

    font-weight:700;
}


/* =========================================
   EMPTY STATE
========================================= */

.empty{
    text-align:center;

    padding:45px;

    color:#788989 !important;

    background:#ffffff !important;
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:1000px){

    .cards{
        grid-template-columns:
            repeat(2,1fr);
    }

}


@media(max-width:900px){

    .sidebar{
        width:210px;
    }

    .main{
        margin-left:210px;

        padding:25px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .table-box{
        overflow-x:auto;
    }

    table{
        min-width:850px;
    }

}


@media(max-width:650px){

    .sidebar{
        width:70px;

        padding:20px 10px;
    }

    .logo{
        justify-content:center;

        margin-bottom:30px;
    }

    .logo span{
        display:none;
    }

    .menu a{
        font-size:0;
        justify-content:center;

        text-align:center;

        padding:14px 8px;
    }

    .menu a::first-letter{
        font-size:16px;
    }

    .menu a.logout{
        left:10px;
        right:10px;
    }

    .main{
        margin-left:70px;

        padding:20px 15px;
    }

    .header h1{
        font-size:25px;
    }

    .table-top{
        flex-direction:column;

        align-items:flex-start;

        gap:15px;
    }

    .search{
        width:100%;
    }

}


/* =========================================
   VERY SMALL SCREENS
========================================= */

@media(max-width:450px){

    .sidebar{
        width:60px;
    }

    .main{
        margin-left:60px;

        padding:15px;
    }

    .card{
        padding:20px;
    }

    .table-box{
        padding:20px;
    }

}



/* =========================================================
   EXAMPORTAL COMMON TYPOGRAPHY
   Keeps the same text sizes on all Super Admin pages.
   ========================================================= */

html{
    font-size:16px !important;
}

body{
    font-size:16px !important;
}

/* Sidebar */
.logo-text,
.logo{
    font-size:20px !important;
}

.admin-label{
    font-size:11px !important;
}

.nav a,
.menu a{
    font-size:14px !important;
    line-height:1.4 !important;
}

.logout a,
.menu a.logout{
    font-size:14px !important;
    line-height:1.4 !important;
}

/* Main page heading */
.title h1,
.header h1{
    font-size:34px !important;
    line-height:1.2 !important;
}

.title p,
.header p{
    font-size:13px !important;
    line-height:1.5 !important;
}

/* Top-right admin label */
.admin-profile{
    font-size:14px !important;
    line-height:1.4 !important;
}

/* Section headings */
.table-top h2,
.panel-header h2,
.rating-card h2,
.distribution h2,
.card h2:not([id]),
.reviews-panel .panel-header h2{
    font-size:19px !important;
    line-height:1.3 !important;
}

/* Stat labels */
.card h4,
.stat-title{
    font-size:13px !important;
    line-height:1.3 !important;
}

/* Stat numbers */
.card h2[id],
.stat-number,
.rating-number{
    line-height:1.1 !important;
}

/* Normal table text */
th,
td{
    line-height:1.4 !important;
}

/* Search / input text */
.search,
.search-box input,
.input-group input,
.input-group select{
    font-size:14px !important;
    line-height:1.4 !important;
}

/* Prevent link/button state from changing text size */
a,
button,
input,
select,
textarea{
    text-size-adjust:100%;
    -webkit-text-size-adjust:100%;
}

/* Mobile: keep one consistent mobile heading size */
@media(max-width:700px){
    .title h1,
    .header h1{
        font-size:26px !important;
    }

    .title p,
    .header p{
        font-size:12px !important;
    }

    .nav a,
    .menu a{
        font-size:14px !important;
    }
}

</style>
</head>


<body>


<!-- =========================================
     SIDEBAR
========================================= -->

<div class="sidebar">

    <div class="logo">

        <img
            src="logo.png"
            alt="ExamPortal"
        >

        <span>ExamPortal</span>

    </div>


    <div class="menu">

        <a href="admin.html">
            <span class="menu-icon">📊</span>
            <span>Dashboard</span>
        </a>

        <a href="students.html" class="active">
            <span class="menu-icon">👨‍🎓</span>
            <span>Students</span>
        </a>

        <a href="colleges.html">
            <span class="menu-icon">🏫</span>
            <span>Colleges</span>
        </a>

        <a href="reports.html">
            <span class="menu-icon">📈</span>
            <span>Reports</span>
        </a>

        <a href="admin-settings.html">
            <span class="menu-icon">⚙️</span>
            <span>Settings</span>
        </a>

        <a href="login.html" class="logout">
            <span class="menu-icon">🚪</span>
            <span>Logout</span>
        </a>

    </div>

</div>



<!-- =========================================
     MAIN CONTENT
========================================= -->

<div class="main">


    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>
                Students
            </h1>

            <p>
                View students who have logged into ExamPortal.
            </p>

        </div>

    </div>



    <!-- =====================================
         STAT CARDS
    ====================================== -->

    <div class="cards">


        <!-- TOTAL LOGINS -->

        <div class="card">

            <h4>
                Total Student Logins
            </h4>

            <h2 id="totalLogins">
                0
            </h2>

        </div>



        <!-- UNIQUE STUDENTS -->

        <div class="card">

            <h4>
                Unique Students
            </h4>

            <h2 id="uniqueStudents">
                0
            </h2>

        </div>



        <!-- LATEST LOGIN -->

        <div class="card">

            <h4>
                Latest Login
            </h4>

            <h2 id="latestLogin">
                --
            </h2>

        </div>

    </div>



    <!-- =====================================
         STUDENT TABLE
    ====================================== -->

    <div class="table-box">


        <div class="table-top">

            <h2>
                Student Login Details
            </h2>


            <input
                type="text"
                class="search"
                id="search"
                placeholder="Search student..."
                onkeyup="displayStudents()"
            >

        </div>



        <table>

            <thead>

                <tr>

                    <th>
                        #
                    </th>

                    <th>
                        Name
                    </th>

                    <th>
                        Student ID
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        Type
                    </th>

                    <th>
                        Login Time
                    </th>

                </tr>

            </thead>


            <tbody id="studentTable">

            </tbody>

        </table>

    </div>

</div>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>


/* =========================================
   GET STUDENT LOGIN RECORDS
========================================= */

function getStudents(){

    const history =
        JSON.parse(
            localStorage.getItem("loginHistory")
        ) || [];


    return history.filter(user =>

        user.type &&

        user.type
            .toLowerCase() === "student"

    );

}



/* =========================================
   DISPLAY STUDENTS
========================================= */

function displayStudents(){

    const students =
        getStudents();


    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase();


    const table =
        document.getElementById(
            "studentTable"
        );


    table.innerHTML = "";


    const filtered =
        students.filter(student => {

            return (

                (student.name || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (student.userId || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (student.email || "")
                    .toLowerCase()
                    .includes(search)

            );

        });



    /* No records */

    if(filtered.length === 0){

        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    No student login records found.
                </td>

            </tr>

        `;

        return;

    }



    /* Display records */

    filtered.forEach(
        (student,index) => {


            let date = "--";


            if(student.timestamp){

                const d =
                    new Date(
                        student.timestamp
                    );


                date =
                    d.toLocaleString();

            }



            table.innerHTML += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>


                    <td>

                        <strong>
                            ${student.name || "Unknown"}
                        </strong>

                    </td>


                    <td>
                        ${student.userId || "--"}
                    </td>


                    <td>
                        ${student.email || "--"}
                    </td>


                    <td>

                        <span class="badge">
                            Student
                        </span>

                    </td>


                    <td>
                        ${date}
                    </td>

                </tr>

            `;

        }
    );

}



/* =========================================
   UPDATE STATISTICS
========================================= */

function updateStats(){

    const students =
        getStudents();



    /* Total logins */

    document
        .getElementById("totalLogins")
        .textContent =
        students.length;



    /* Unique students */

    const unique =
        new Set();


    students.forEach(student => {

        const id =

            student.userId ||

            student.email ||

            student.name;


        if(id){

            unique.add(id);

        }

    });


    document
        .getElementById("uniqueStudents")
        .textContent =
        unique.size;



    /* Latest login */

    if(students.length > 0){

        const latest =
            students[
                students.length - 1
            ];


        if(latest.timestamp){

            const d =
                new Date(
                    latest.timestamp
                );


            document
                .getElementById("latestLogin")
                .textContent =

                d.toLocaleTimeString(
                    [],
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

        }

    }

    else{

        document
            .getElementById("latestLogin")
            .textContent =
            "--";

    }

}



/* =========================================
   LOAD PAGE
========================================= */

function loadPage(){

    updateStats();

    displayStudents();

}



/* =========================================
   AUTO REFRESH
========================================= */

setInterval(() => {

    updateStats();

    displayStudents();

},3000);



/* =========================================
   START
========================================= */

loadPage();


</script>

</body>
</html>
