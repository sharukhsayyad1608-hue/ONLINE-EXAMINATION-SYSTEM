<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exams | ExamPortal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        html {
            font-size: 16px;
            overflow-y: scroll;
        }

        body {
            background: #f5f8f8;
            color: #173033;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(20, 123, 125, 0.07),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(20, 123, 125, 0.06),
                    transparent 30%
                );
        }

        /* Header */
        header {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: #ffffff;
            border-bottom: 1px solid #e1e9e8;
            box-shadow: 0 4px 18px rgba(23, 48, 51, 0.04);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 10px;
        }

        .brand h2 {
            font-size: 20px;
            color: #173033;
        }

        .brand span {
            color: #147b7d;
        }

        header a {
            text-decoration: none;
            color: #5d7070;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        header a:hover {
            color: #147b7d;
        }

        /* Main container */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 30px;
            color: #173033;
        }

        .heading span {
            color: #147b7d;
        }

        /* Button */
        .btn {
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            color: #ffffff;
            cursor: pointer;
            background: #147b7d;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(20, 123, 125, 0.16);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .btn:hover {
            background: #10686a;
            transform: translateY(-1px);
        }

        /* Cards */
        .form-card,
        .table-card {
            background: #ffffff;
            border: 1px solid #dbe6e5;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(25, 55, 55, 0.045);
        }

        .form-card {
            padding: 28px;
            margin-bottom: 30px;
        }

        .form-card h2,
        .table-card h2 {
            color: #203536;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        label {
            display: block;
            color: #607474;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            border: 1px solid #d8e3e2;
            background: #ffffff;
            color: #173033;
            outline: none;
            font-size: 14px;
        }

        input::placeholder {
            color: #9aa8a8;
        }

        input:focus,
        select:focus {
            border-color: #147b7d;
            box-shadow: 0 0 0 3px rgba(20, 123, 125, 0.08);
        }

        .form-submit {
            margin-top: 20px;
        }

        /* Exam table */
        .table-card {
            padding: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
            margin-top: 5px;
        }

        th,
        td {
            padding: 15px 12px;
            text-align: left;
            border-bottom: 1px solid #e6eeee;
        }

        th {
            color: #147b7d;
            font-size: 13px;
            font-weight: 700;
        }

        td {
            color: #536868;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f8fbfb;
        }

        /* Status */
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #e7f5f3;
            color: #147b7d;
            font-size: 12px;
            font-weight: 600;
        }

        /* Delete button */
        .delete {
            background: #fff2f3;
            color: #c64550;
            border: 1px solid #f3c8cc;
            padding: 7px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s ease;
        }

        .delete:hover {
            background: #ffe7e9;
        }

        /* Empty table message */
        .empty-row {
            text-align: center;
            color: #8a9999;
            padding: 25px;
        }

        /* Mobile */
        @media (max-width: 650px) {
            header {
                padding: 0 20px;
            }

            .container {
                padding: 0 15px;
                margin-top: 25px;
            }

            .heading {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .heading h1 {
                font-size: 26px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-card,
            .table-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">
            <img src="logo.png" alt="ExamPortal Logo">
            <h2>Exam<span>Portal</span></h2>
        </div>

        <a href="admin.html">← Admin Dashboard</a>
    </header>

    <main class="container">

        <div class="heading">
            <h1>Manage <span>Exams</span></h1>
        </div>

        <!-- Create Exam -->
        <section class="form-card">
            <h2>➕ Create New Exam</h2>

            <div class="form-grid">

                <div>
                    <label for="examName">Exam Name</label>
                    <input
                        type="text"
                        id="examName"
                        placeholder="Example: Java Fundamentals"
                    >
                </div>

                <div>
                    <label for="subject">Subject</label>
                    <select id="subject">
                        <option value="">Select Subject</option>
                        <option>Java</option>
                        <option>Python</option>
                        <option>C</option>
                        <option>JavaScript</option>
                        <option>C++</option>
                    </select>
                </div>

                <div>
                    <label for="questionCount">Number of Questions</label>
                    <input
                        type="number"
                        id="questionCount"
                        placeholder="10"
                        min="1"
                    >
                </div>

                <div>
                    <label for="duration">Duration (Minutes)</label>
                    <input
                        type="number"
                        id="duration"
                        placeholder="10"
                        min="1"
                    >
                </div>

            </div>

            <div class="form-submit">
                <button class="btn" onclick="addExam()">
                    Create Exam
                </button>
            </div>
        </section>

        <!-- Exam List -->
        <section class="table-card">

            <h2>📋 Existing Exams</h2>

            <table>
                <thead>
                    <tr>
                        <th>Exam Name</th>
                        <th>Subject</th>
                        <th>Questions</th>
                        <th>Duration</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="examTable"></tbody>
            </table>

        </section>

    </main>

    <script>
        let exams = JSON.parse(
            localStorage.getItem("adminExams")
        ) || [
            {
                name: "Java Fundamentals",
                subject: "Java",
                questions: 10,
                duration: 10,
                status: "Active"
            },
            {
                name: "Python Basics",
                subject: "Python",
                questions: 10,
                duration: 10,
                status: "Active"
            },
            {
                name: "C Programming",
                subject: "C",
                questions: 10,
                duration: 10,
                status: "Active"
            }
        ];

        function displayExams() {
            const table = document.getElementById("examTable");

            table.innerHTML = "";

            if (exams.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-row">
                            No exams created yet.
                        </td>
                    </tr>
                `;
                return;
            }

            exams.forEach((exam, index) => {
                table.innerHTML += `
                    <tr>
                        <td>${escapeHtml(exam.name)}</td>
                        <td>${escapeHtml(exam.subject)}</td>
                        <td>${exam.questions}</td>
                        <td>${exam.duration} min</td>
                        <td>
                            <span class="status">
                                ${escapeHtml(exam.status)}
                            </span>
                        </td>
                        <td>
                            <button
                                class="delete"
                                onclick="deleteExam(${index})"
                            >
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        function addExam() {
            const name = document
                .getElementById("examName")
                .value
                .trim();

            const subject = document
                .getElementById("subject")
                .value;

            const questions = document
                .getElementById("questionCount")
                .value;

            const duration = document
                .getElementById("duration")
                .value;

            if (!name || !subject || !questions || !duration) {
                alert("Please fill all fields.");
                return;
            }

            exams.push({
                name: name,
                subject: subject,
                questions: Number(questions),
                duration: Number(duration),
                status: "Active"
            });

            localStorage.setItem(
                "adminExams",
                JSON.stringify(exams)
            );

            document.getElementById("examName").value = "";
            document.getElementById("subject").value = "";
            document.getElementById("questionCount").value = "";
            document.getElementById("duration").value = "";

            displayExams();

            alert("Exam created successfully!");
        }

        function deleteExam(index) {
            if (
                confirm(
                    "Are you sure you want to delete this exam?"
                )
            ) {
                exams.splice(index, 1);

                localStorage.setItem(
                    "adminExams",
                    JSON.stringify(exams)
                );

                displayExams();
            }
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(
                /[&<>"']/g,
                function (character) {
                    return {
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                        "'": "&#039;"
                    }[character];
                }
            );
        }

        displayExams();
    </script>

</body>
</html>
